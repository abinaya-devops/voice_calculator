name: Build Android APK

# Builds a signed-with-debug-key release APK on every push to master and
# uploads it for download from the Actions run and from a rolling "latest"
# release. (Debug-key signing is fine for personal/testing installs; for
# Play Store you would create a real keystore.)

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore release signing key
        env:
          KEY_JKS_BASE64: ${{ secrets.KEY_JKS_BASE64 }}
        run: |
          if [ -n "$KEY_JKS_BASE64" ]; then
            echo "$KEY_JKS_BASE64" | base64 -d > android/key.jks
            cat > android/key.properties <<'EOF'
            storePassword=voicecalc2026
            keyPassword=voicecalc2026
            keyAlias=voicecalc
            storeFile=key.jks
            EOF
            echo "Release keystore restored."
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "KEY_JKS_BASE64 not set - building with debug signing."
          fi

      - name: Download packages
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk voice-calculator.apk

      - name: Attach APK to this workflow run
        uses: actions/upload-artifact@v4
        with:
          name: voice-calculator-apk
          path: voice-calculator.apk

      - name: Update rolling "latest" release
        if: env.SIGNED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest APK
          prerelease: true
          files: voice-calculator.apk
          allow_updates: true
