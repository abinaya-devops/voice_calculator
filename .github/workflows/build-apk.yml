name: Build Android APK

# Builds the release APK on every push to master, signs it with the stable
# keystore (restored from the KEY_JKS_BASE64 secret) and uploads it to the
# rolling "latest" release. Debug-signs only when the secret is absent, and
# never publishes a debug-signed APK to the release.

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore release signing key
        env:
          KEY_JKS_BASE64: ${{ secrets.KEY_JKS_BASE64 }}
        run: |
          if [ -z "$KEY_JKS_BASE64" ]; then
            echo "KEY_JKS_BASE64 not set - building with debug signing."
            exit 0
          fi
          CLEAN=$(printf '%s' "$KEY_JKS_BASE64" | tr -cd 'A-Za-z0-9+/=')
          echo "Secret received: ${#CLEAN} base64 characters (expected ~3712)."
          printf '%s' "$CLEAN" | base64 -d > android/key.jks
          SIZE=$(wc -c < android/key.jks)
          echo "Decoded keystore: $SIZE bytes (expected ~2782)."
          if [ "$SIZE" -lt 100 ]; then
            echo "::error::KEY_JKS_BASE64 did not decode to a keystore (got $SIZE bytes). Re-copy the FULL contents of keystore.base64.txt into the secret."
            exit 1
          fi
          if command -v keytool >/dev/null 2>&1; then
            if ! keytool -list -keystore android/key.jks -storepass voicecalc2026 >/dev/null 2>&1; then
              echo "::error::Secret decodes but is not a valid keystore (or password mismatch). Re-create the secret from keystore.base64.txt."
              exit 1
            fi
          else
            echo "keytool not on PATH - skipping keystore validation."
          fi
          printf '%s\n' \
            'storePassword=voicecalc2026' \
            'keyPassword=voicecalc2026' \
            'keyAlias=voicecalc' \
            'storeFile=key.jks' > android/key.properties
          echo "Release keystore restored and verified."
          echo "SIGNED=true" >> "$GITHUB_ENV"

      - name: Download packages
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk voice-calculator.apk

      - name: Attach APK to this workflow run
        uses: actions/upload-artifact@v4
        with:
          name: voice-calculator-apk
          path: voice-calculator.apk

      - name: Update rolling "latest" release
        if: env.SIGNED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest APK
          prerelease: true
          files: voice-calculator.apk
          allow_updates: true
