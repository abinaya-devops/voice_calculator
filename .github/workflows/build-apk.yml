name: Build Android APK

# Builds the release APK on every push to master, signs it with the stable
# keystore, and uploads it to the rolling "latest" release.
#
# Signing setup: the keystore is AES-256 encrypted into android/key.jks.enc
# (committed to the repo - useless without the password). The decryption
# password lives in the KEY_PASSWORD GitHub secret. If the secret is absent
# the build falls back to debug signing and never touches the release.

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore release signing key
        env:
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEY_PASSWORD" ]; then
            echo "KEY_PASSWORD not set - building with debug signing."
            exit 0
          fi
          if [ ! -f android/key.jks.enc ]; then
            echo "::error::KEY_PASSWORD is set but android/key.jks.enc is missing from the repo."
            exit 1
          fi
          # Trim any whitespace the paste may have picked up.
          KEY_PASSWORD=$(printf '%s' "$KEY_PASSWORD" | tr -d ' \r\n\t')
          KP="$KEY_PASSWORD" openssl enc -d -aes-256-cbc -pbkdf2 \
            -in android/key.jks.enc -out android/key.jks -pass env:KP
          if [ ! -s android/key.jks ]; then
            echo "::error::Decryption produced an empty keystore - the KEY_PASSWORD secret does not match. Re-check the secret value."
            exit 1
          fi
          if command -v keytool >/dev/null 2>&1; then
            if ! keytool -list -keystore android/key.jks -storepass voicecalc2026 >/dev/null 2>&1; then
              echo "::error::Keystore decrypted but is invalid (or store password mismatch)."
              exit 1
            fi
          else
            echo "keytool not on PATH - skipping keystore validation."
          fi
          printf '%s\n' \
            'storePassword=voicecalc2026' \
            'keyPassword=voicecalc2026' \
            'keyAlias=voicecalc' \
            'storeFile=key.jks' > android/key.properties
          echo "Release keystore restored and verified."
          echo "SIGNED=true" >> "$GITHUB_ENV"

      - name: Download packages
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk voice-calculator.apk

      - name: Attach APK to this workflow run
        uses: actions/upload-artifact@v4
        with:
          name: voice-calculator-apk
          path: voice-calculator.apk

      - name: Update rolling "latest" release
        if: env.SIGNED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest APK
          prerelease: true
          files: voice-calculator.apk
          allow_updates: true
